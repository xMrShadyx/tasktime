<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskTime</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="dashboard.css"></head><body>
<header class="top"><div class="brand"><img src="icons/icon48.png" alt=""><span>TaskTime</span></div><div id="status" class="status"></div><select id="lang" aria-label="Language"><option value="bg">БГ</option><option value="en">EN</option></select></header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main>
<div id="questions"></div>
<section data-tab="today"><div class="kpis" id="kpis"></div><div class="grid2"><div class="card"><h2 id="todayTypesTitle"></h2><div id="todayTypes"></div></div><div class="card"><h2 id="shiftNowTitle"></h2><div id="shiftNow"></div></div></div><div class="card"><h2 id="recentTitle"></h2><div id="recent" class="list"></div></div></section>
<section data-tab="stats"><div class="card"><div class="toolbar"><div class="presets" id="presets"></div><label><span id="fromLabel"></span><input id="from" type="date"></label><label><span id="toLabel"></span><input id="to" type="date"></label><button id="csv" class="ghost"></button></div><div class="tablewrap"><table><thead id="head"></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div><p class="hint" id="statsNote"></p></div></section>
<section data-tab="shifts"><div id="shifts" class="list"></div></section>
<section data-tab="review"><p class="hint" id="reviewNote"></p><div id="review" class="list"></div></section>
<section data-tab="history"><div class="card"><div class="toolbar"><input id="search" type="search"></div><div id="history" class="list"></div></div></section>
<section data-tab="settings"><div class="card"><h2 id="alertTitle"></h2><p class="hint" id="alertNote"></p>
<label class="row"><span id="alertSoundLabel"></span><input id="alertSound" type="checkbox" class="switch"></label>
<label class="row"><span id="alertVolumeLabel"></span><input id="alertVolume" type="range" min="0" max="1" step="0.05"></label>
<div class="row"><span></span><button id="alertTest" class="ghost"></button></div>
<label class="row"><span id="alertNotifyLabel"></span><input id="alertNotify" type="checkbox" class="switch"></label></div>
<div class="card"><h2 id="dataTitle"></h2><p class="hint" id="dataNote"></p><button id="backup" class="ghost"></button></div></section>
</main><p role="status" id="message"></p>
<script src="core.js"></script><script src="dashboard.js"></script></body></html>
